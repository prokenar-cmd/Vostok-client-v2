name: VOSTOK Client V2 - Dialog UI 001 Prep

on:
  push:
    branches:
      - client-v2-dialog-ui-001
  workflow_dispatch:

jobs:
  candidate-prep:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate candidate status
        run: |
          test -f STATUS_CLIENT_DIALOG_UI_001.md
          grep -q 'Exact current Azure Mobile source' STATUS_CLIENT_DIALOG_UI_001.md
          grep -q 'Dialog.java' STATUS_CLIENT_DIALOG_UI_001.md
          grep -q 'DialogAdapter.java' STATUS_CLIENT_DIALOG_UI_001.md
          grep -q 'DIALOG_UI_001' STATUS_CLIENT_DIALOG_UI_001.md
          grep -q 'Promotion: NOT YET' STATUS_CLIENT_DIALOG_UI_001.md

      - name: Detect exact client source import
        run: |
          if [ -f app/src/main/java/ru/azure/games/gui/dialogs/Dialog.java ]; then
            echo 'Exact Azure source is present: full UI/build gate can run next.'
          else
            echo 'Exact Azure source import is pending. This is a prep gate only.'
          fi
