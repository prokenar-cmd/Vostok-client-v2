name: KRANIN Launcher Locate

on:
  push:
    paths:
      - ".github/workflows/kranin-launcher-locate.yml"

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate purchased launcher record
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SIZE=116472720
          curl -L -sS --fail "https://api.kraninshop.ru/client/patch_index.json" -o patch_index.json

          python3 - <<'PY' > launchers.tsv
          import json
          data=json.load(open("patch_index.json","r",encoding="utf-8"))
          found=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get("path")=="launcher.apk":
                      found.append((x.get("filesize"),x.get("link"),x.get("rule_file"),x.get("crc_xxhashct")))
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          seen=set()
          for row in found:
              if row not in seen:
                  seen.add(row)
                  print("\t".join("" if v is None else str(v) for v in row))
          PY

          echo "=== ALL UNIQUE launcher.apk RECORDS ==="
          cat launchers.tsv
          echo "=== EXACT SIZE $TARGET_SIZE ==="
          grep "^$TARGET_SIZE"$'\t' launchers.tsv || true
          echo "=== CLOSEST SIZES ==="
          python3 - <<'PY'
          target=116472720
          rows=[]
          for line in open("launchers.tsv",encoding="utf-8"):
              p=line.rstrip("\n").split("\t")
              try: size=int(p[0])
              except: continue
              rows.append((abs(size-target),line.rstrip()))
          for _,line in sorted(rows)[:10]:
              print(line)
          PY
